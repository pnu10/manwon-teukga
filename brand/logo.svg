<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D477"/>
      <stop offset="0.55" stop-color="#00B368"/>
      <stop offset="1" stop-color="#007E48"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF7F2"/>
    </linearGradient>
    <pattern id="guilloche" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <rect width="26" height="26" fill="none"/>
      <rect width="2" height="26" fill="#FFFFFF" opacity="0.07"/>
    </pattern>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00301B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="140" fill="url(#bg)"/>
  <rect width="600" height="600" rx="140" fill="url(#guilloche)"/>

  <!-- 액면가 워터마크 -->
  <text x="566" y="534" text-anchor="end"
        font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', Helvetica, sans-serif"
        font-size="132" font-weight="800" fill="#FFFFFF" opacity="0.07" letter-spacing="-6">10000</text>

  <!-- 지폐 -->
  <g transform="rotate(-7 300 300)" filter="url(#drop)">
    <rect x="118" y="182" width="364" height="228" rx="30" fill="url(#note)"/>
    <rect x="140" y="204" width="320" height="184" rx="18" fill="none" stroke="#00B368" stroke-opacity="0.28" stroke-width="3"/>
    <circle cx="300" cy="296" r="74" fill="none" stroke="#00B368" stroke-opacity="0.18" stroke-width="3"/>
    <text x="300" y="344"
          font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', Helvetica, sans-serif"
          font-size="146" font-weight="800" fill="#00A85F" text-anchor="middle" letter-spacing="-4">₩</text>
    <text x="163" y="240"
          font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', Helvetica, sans-serif"
          font-size="30" font-weight="800" fill="#00A85F" opacity="0.85" letter-spacing="-1">10,000</text>
    <text x="437" y="376" text-anchor="end"
          font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', Helvetica, sans-serif"
          font-size="30" font-weight="800" fill="#00A85F" opacity="0.85" letter-spacing="-1">이하만</text>
  </g>
</svg>
